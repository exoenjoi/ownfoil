{% extends "base.html" %}


{% block content %}
{% include 'nav.html' %}
<div id="content" class="container-fluid mt-3">

    <div class="row gy-2 gx-3 align-items-center library-toolbar">

        <div class="col-auto">
            <div class="btn-group dropdown-center" role="group">
                <div class="btn-group" role="group">
                    <button id="filterDropdownBtn" type="button" class="btn btn-primary dropdown-toggle"
                        data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                        aria-label="Filters" title="Filters">
                        <i class="bi bi-funnel-fill"></i>
                        <span id="activeFilterCount" class="badge rounded-pill text-bg-light d-none">0</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <div class="dropdown-item">
                                <div class="btn-group w-100" role="group" aria-label="Type filter">
                                    <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="typeAll">All</label>

                                    <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeBase" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="typeBase">Base</label>

                                    <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeDlc" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="typeDlc">DLC</label>
                                </div>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <div class="dropdown-item">
                                <div class="btn-group w-100" role="group" aria-label="Ownership filter">
                                    <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="ownershipAll">All</label>

                                    <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipOwned" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="ownershipOwned">Owned</label>

                                    <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipMissing" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="ownershipMissing">Missing</label>
                                </div>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <div class="dropdown-item">
                                <div class="btn-group w-100" role="group" aria-label="Update filter">
                                    <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="updateAll">All</label>

                                    <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateUpToDate" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="updateUpToDate">Up to date</label>

                                    <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateMissingUpdate" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="updateMissingUpdate">Missing Update</label>
                                </div>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <div class="dropdown-item">
                                <div class="btn-group w-100" role="group" aria-label="Completion filter">
                                    <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="completionAll">All</label>

                                    <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionComplete" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="completionComplete">Complete</label>

                                    <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionMissingDlc" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="completionMissingDlc">Missing DLC</label>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm">
            <input type="search" id="textFilter" class="form-control" placeholder="Search titles, title IDs...">
        </div>
        <div class="col-auto">
            <div class="btn-group" role="group" aria-label="View">
                <button id="view-toggle-btn-card" type="button" class="btn btn-primary view-toggle-btn" data-view="card"
                    aria-label="Card view" title="Card view"><i class="bi bi-card-heading"></i></button>
                <button id="view-toggle-btn-icon" type="button" class="btn btn-primary view-toggle-btn" data-view="icon"
                    aria-label="Icon view" title="Icon view"><i class="bi bi-grid-fill"></i></button>
                <button id="view-toggle-btn-list" type="button" class="btn btn-primary view-toggle-btn" data-view="list"
                    aria-label="List view" title="List view"><i class="bi bi-list-ul"></i></button>
            </div>
        </div>
        <div class="col-auto">
            <div class="btn-group dropdown-center" role="group">
                <button id="itemsPerPageDropdownBtn" type="button" class="btn btn-primary dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    12 per page
                </button>
                <ul class="dropdown-menu" aria-labelledby="itemsPerPageDropdownBtn">
                    <li><button class="dropdown-item items-per-page" data-value="12">12</button></li>
                    <li><button class="dropdown-item items-per-page" data-value="24">24</button></li>
                    <li><button class="dropdown-item items-per-page" data-value="48">48</button></li>
                    <li><button class="dropdown-item items-per-page" data-value="96">96</button></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <div class="dropdown-item">
                            <div class="input-group">
                                <input type="number" id="customItemsPerPage" class="form-control" min="1" placeholder="Custom">
                                <button id="applyCustomItemsPerPage" class="btn btn-primary">Set</button>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <!-- Tile size slider -->
        <div class="col-auto" id="tileSizeWrapper">
            <input type="range" class="form-range" min="1" max="5" step="1" id="cardSizeRange"
                aria-label="Tile size" title="Tile size">
        </div>
    </div>

    <div id="librarySummary" class="library-summary"></div>

    <div class="grid-container">
        <div class="library-grid" id="gameGrid"></div>
        <div id="libraryEmpty" class="library-empty d-none"></div>
    </div>

    <!-- Pagination controls -->
    <nav aria-label="Page navigation" class="mt-3">
        <ul class="pagination justify-content-center" id="paginationControls"></ul>
    </nav>
</div>

<script>
    let games;
    let filteredGames;
    let itemsPerPage = 12;
    let currentPage = 1;
    let totalGames = 0;
    let cardSize = 3; // Default tile size
    let currentView = 'card'; // Default view is 'card'

    // Smaller number = larger tiles. Drives the CSS grid's minimum column width.
    const TILE_WIDTHS = { 1: 420, 2: 300, 3: 220, 4: 165, 5: 125 };

    function fetchGames() {
        return new Promise((resolve, reject) => {
            $.get(`/api/titles`, function (data) {
                totalGames = data.total;
                games = data.games;
                filteredGames = games;
                resolve();
            }).fail(function() {
                reject();
            });
        });
    }

    // One entry per file in the library becomes one entry per title: a game and its DLCs
    // are the same object to the eye, so the card can state what the title is missing.
    function groupTitles(entries) {
        const groups = new Map();
        entries.forEach(entry => {
            const key = entry.title_id || entry.app_id;
            let group = groups.get(key);
            if (!group) {
                group = { key: key, name: entry.title_id_name || entry.name, base: null, dlcs: [] };
                groups.set(key, group);
            }
            if (entry.app_type === 'DLC') {
                group.dlcs.push(entry);
            } else if (!group.base) {
                group.base = entry;
            }
        });

        return [...groups.values()].map(group => {
            const lead = group.base || group.dlcs[0];
            const ownedDlcs = group.dlcs.filter(dlc => dlc.owned).length;
            return {
                key: group.key,
                name: group.name || lead.name,
                lead: lead,
                base: group.base,
                dlcs: group.dlcs,
                ownedDlcs: ownedDlcs,
                // The amber outline marks a title you cannot play at its current version:
                // no base file, or a pending update. Missing DLC is common enough that
                // outlining it too would light up the whole page — the counter says it.
                incomplete: group.base ? (!group.base.owned || group.base.has_latest_version === false) : true
            };
        });
    }

    function pageOf(groups) {
        const start = (currentPage - 1) * itemsPerPage;
        return groups.slice(start, start + itemsPerPage);
    }

    function renderGames() {
        $('#cardSizeRange').val(cardSize);
        applyTileSize();

        const groups = groupTitles(filteredGames);
        const totalPages = Math.max(1, Math.ceil(groups.length / itemsPerPage));
        if (currentPage > totalPages) {
            currentPage = totalPages;
        }

        const gameGrid = $('#gameGrid');
        gameGrid.empty().removeClass('view-list');
        $('#tileSizeWrapper').toggleClass('invisible', currentView === 'list');

        if (currentView === 'card') {
            renderCardView(pageOf(groups));
        } else if (currentView === 'icon') {
            renderIconView(pageOf(groups));
        } else {
            gameGrid.addClass('view-list');
            renderListView(pageOf(groups));
        }

        renderSummary(groups);
        renderEmptyState(groups.length);
        updatePaginationControls(groups.length);

        // init version tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))

        // init version popovers
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    }

    function versionBadgeFor(group) {
        const base = group.base;
        if (!base || base.has_latest_version === undefined) {
            return null;
        }
        const badge = $('<span class="badge rounded-pill game-tag version-tag"></span>')
            .addClass(`text-bg-${base.has_latest_version ? 'success' : 'warning'}`)
            .html(`<i class="bi ${base.has_latest_version ? 'bi-check-circle-fill' : 'bi-arrow-down-circle'}"></i>`);

        const versions = Array.isArray(base.version) ? base.version : null;
        if (versions && versions.length) {
            const rows = versions.slice().reverse().map(version => `
                <div class="version-row">
                    <span class="version-number">v${version.version}</span>
                    <span class="version-date">${version.release_date}</span>
                    <span class="badge rounded-pill text-bg-${version.owned ? 'success' : 'warning'}">${version.owned ? 'Owned' : 'Missing'}</span>
                </div>`).join('');
            badge.attr({ 'tabindex': '0', 'role': 'button' }).popover({
                title: `${base.name} updates`,
                content: rows,
                html: true,
                trigger: 'click',
                placement: 'top',
            });
            badge.css('cursor', 'pointer');
            // The document-level handler below closes any open popover; without this the
            // badge's own click bubbles straight into it and the popover never shows.
            badge.on('click', e => e.stopPropagation());
        } else {
            badge.attr('data-bs-toggle', 'tooltip');
            badge.attr('data-bs-placement', 'top');
            badge.attr('data-bs-title', versions ? 'No update released' : 'Version v' + base.version);
        }
        return badge;
    }

    function dlcBadgeFor(group) {
        if (!group.dlcs.length) {
            return null;
        }
        const complete = group.ownedDlcs === group.dlcs.length;
        return $('<span class="badge rounded-pill game-tag" data-bs-toggle="tooltip" data-bs-placement="top"></span>')
            .addClass(`text-bg-${complete ? 'success' : 'warning'}`)
            .attr('data-bs-title', `${group.ownedDlcs} of ${group.dlcs.length} DLC owned`)
            .html(`<i class="bi bi-box-seam-fill"></i> ${group.ownedDlcs}/${group.dlcs.length}`);
    }

    function tagsFor(group) {
        const tags = $('<div class="tags-container"></div>');
        if (!group.base) {
            tags.append($('<span class="badge rounded-pill text-bg-warning game-tag"></span>').text('DLC only'));
        } else if (!group.base.owned) {
            tags.append($('<span class="badge rounded-pill text-bg-warning game-tag"></span>').text('Base missing'));
        }
        const version = versionBadgeFor(group);
        if (version) {
            tags.append(version);
        }
        const dlc = dlcBadgeFor(group);
        if (dlc) {
            tags.append(dlc);
        }
        const search = missingContentSearchButton(group);
        if (search) {
            tags.append(search);
        }
        return tags;
    }

    function renderCardView(pageGroups) {
        const gameGrid = $('#gameGrid');

        pageGroups.forEach(function (group) {
            const card = $('<div class="card text-bg-dark game-card"></div>').toggleClass('is-incomplete', group.incomplete);

            const img = $('<img class="card-img" alt="">').attr('src', group.lead.bannerUrl);
            card.append(img);

            const cardOverlay = $('<div class="card-img-overlay game-info"></div>');

            const title = $('<h5 class="card-title game-title"></h5>').text(group.name);
            cardOverlay.append(title);

            cardOverlay.append(tagsFor(group));
            card.append(cardOverlay);
            gameGrid.append(card);
        });
    }

    function renderIconView(pageGroups) {
        const gameGrid = $('#gameGrid');

        pageGroups.forEach(group => {
            const tile = $('<div class="game-icon-tile"></div>').toggleClass('is-incomplete', group.incomplete);
            tile.append($('<img class="game-icon">').attr({ 'src': group.lead.iconUrl, 'alt': group.name, 'title': group.name }));
            gameGrid.append(tile);
        });
    }

    function renderListView(pageGroups) {
        const gameGrid = $('#gameGrid');

        pageGroups.forEach(group => {
            const row = $('<div class="library-row"></div>').toggleClass('is-incomplete', group.incomplete);
            row.append($('<img class="library-row-icon" alt="">').attr('src', group.lead.iconUrl));

            const main = $('<div class="library-row-main"></div>');
            main.append($('<div class="library-row-title"></div>').text(group.name));
            main.append($('<div class="library-row-meta"></div>').text(group.lead.title_id || group.lead.id));
            row.append(main);

            row.append(tagsFor(group).removeClass('tags-container').addClass('library-row-tags'));
            gameGrid.append(row);
        });
    }

    function renderSummary(groups) {
        const summary = $('#librarySummary');
        summary.empty();

        if (!groups.length) {
            return;
        }

        const pendingUpdates = groups.filter(group => group.base && group.base.has_latest_version === false).length;
        const missingDlcs = groups.filter(group => group.ownedDlcs < group.dlcs.length).length;

        summary.append($('<span></span>').text(`${groups.length} ${groups.length === 1 ? 'title' : 'titles'}`));

        if (pendingUpdates) {
            summary.append(shortcut(`${pendingUpdates} missing an update`, () => {
                $('#updateMissingUpdate').prop('checked', true).trigger('change');
            }));
        }
        if (missingDlcs) {
            summary.append(shortcut(`${missingDlcs} missing DLC`, () => {
                $('#completionMissingDlc').prop('checked', true).trigger('change');
            }));
        }
        if (anyFilterActive()) {
            summary.append(shortcut('Clear filters', clearFilters, 'clear'));
        }
    }

    function shortcut(label, onClick, extraClass) {
        return $('<button type="button" class="btn btn-link btn-sm library-shortcut"></button>')
            .addClass(extraClass || '')
            .text(label)
            .on('click', onClick);
    }

    function anyFilterActive() {
        return Boolean(activeTypeFilter || activeOwnershipFilter || activeUpdateFilter
            || activeCompletionFilter || $('#textFilter').val());
    }

    function clearFilters() {
        $('#typeAll, #ownershipAll, #updateAll, #completionAll').prop('checked', true);
        $('#textFilter').val('');
        localStorage.removeItem('searchTerm');
        updateFilter();
        saveFiltersToStorage();
        applyFilters();
    }

    function updateFilterCount() {
        const count = [activeTypeFilter, activeOwnershipFilter, activeUpdateFilter, activeCompletionFilter]
            .filter(Boolean).length;
        $('#activeFilterCount').text(count).toggleClass('d-none', count === 0);
    }

    function renderEmptyState(count) {
        const empty = $('#libraryEmpty');
        if (count) {
            empty.addClass('d-none');
            return;
        }
        empty.removeClass('d-none').empty();
        if (games && games.length) {
            empty.append($('<p class="mb-2"></p>').text('No titles match these filters.'));
            empty.append(shortcut('Clear filters', clearFilters, 'clear'));
        } else {
            empty.append($('<p class="mb-2"></p>').text('This library is empty.'));
            empty.append($('<a class="btn btn-primary btn-sm" href="/settings">Add a library path</a>'));
        }
    }

    function applyTileSize() {
        document.getElementById('gameGrid').style.setProperty('--tile', `${TILE_WIDTHS[cardSize] || 220}px`);
    }

    // Windowed page numbers: a 2000-title library is 167 pages, and rendering them all
    // makes the control unusable. Show the edges, the current page and its neighbours.
    function pageNumbers(totalPages) {
        if (totalPages <= 7) {
            return Array.from({ length: totalPages }, (_, i) => i + 1);
        }
        const pages = new Set([1, totalPages, currentPage]);
        [-2, -1, 1, 2].forEach(offset => {
            const page = currentPage + offset;
            if (page > 1 && page < totalPages) {
                pages.add(page);
            }
        });
        const sorted = [...pages].sort((a, b) => a - b);
        const withGaps = [];
        sorted.forEach((page, index) => {
            if (index && page - sorted[index - 1] > 1) {
                withGaps.push('gap');
            }
            withGaps.push(page);
        });
        return withGaps;
    }

    function goToPage(page) {
        currentPage = page;
        renderGames();
        document.getElementById('content').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function updatePaginationControls(nbDisplayedGames) {
        const paginationControls = $('#paginationControls');
        paginationControls.empty(); // Clear existing pagination

        const totalPages = Math.ceil(nbDisplayedGames / itemsPerPage);
        if (totalPages <= 1) {
            return;
        }

        // Previous button
        const prevButton = $('<li class="page-item"></li>').addClass(currentPage === 1 ? 'disabled' : '').html(`
                <a class="page-link" href="#" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>`);
        prevButton.click(function (e) {
            e.preventDefault();
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        });
        paginationControls.append(prevButton);

        // Page numbers
        pageNumbers(totalPages).forEach(function (page) {
            if (page === 'gap') {
                paginationControls.append('<li class="page-item disabled"><span class="page-link">&hellip;</span></li>');
                return;
            }
            const pageButton = $('<li class="page-item"></li>').addClass(page === currentPage ? 'active' : '').html(`<a class="page-link" href="#">${page}</a>`);
            pageButton.click(function (e) {
                e.preventDefault();
                goToPage(page);
            });
            paginationControls.append(pageButton);
        });

        // Next button
        const nextButton = $('<li class="page-item"></li>').addClass(currentPage === totalPages ? 'disabled' : '').html(`
                <a class="page-link" href="#" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>`);
        nextButton.click(function (e) {
            e.preventDefault();
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        });
        paginationControls.append(nextButton);
    }

    function setItemsPerPage(value) {
        itemsPerPage = value;
        localStorage.setItem('itemsPerPage', itemsPerPage);
        $('#itemsPerPageDropdownBtn').text(`${itemsPerPage} per page`);
        $('.items-per-page').each(function () {
            $(this).toggleClass('active', $(this).data('value') === itemsPerPage);
        });
        currentPage = 1;
    }

    function setView(view) {
        currentView = view;
        localStorage.setItem('currentView', view);
        $('.view-toggle-btn').removeClass('active').attr('aria-pressed', 'false');
        $(`.view-toggle-btn[data-view="${view}"]`).addClass('active').attr('aria-pressed', 'true');
        currentPage = 1;
    }

    function saveFiltersToStorage() {
        const filters = {
            type: "",
            ownership: "",
            update: "",
            completion: ""
        };

        if ($('#typeBase').is(':checked')) {
            filters.type = 'BASE';
        } else if ($('#typeDlc').is(':checked')) {
            filters.type = 'DLC';
        }

        if ($('#ownershipOwned').is(':checked')) {
            filters.ownership = 'Owned';
        } else if ($('#ownershipMissing').is(':checked')) {
            filters.ownership = 'Missing';
        }

        if ($('#updateUpToDate').is(':checked')) {
            filters.update = 'Up to date';
        } else if ($('#updateMissingUpdate').is(':checked')) {
            filters.update = 'Outdated';
        }

        if ($('#completionComplete').is(':checked')) {
            filters.completion = 'Complete';
        } else if ($('#completionMissingDlc').is(':checked')) {
            filters.completion = 'Missing DLC';
        }

        localStorage.setItem('activeFilters', JSON.stringify(filters));
    }

    function loadFiltersFromStorage() {
        const savedFilters = localStorage.getItem('activeFilters');
        if (savedFilters) {
            const filters = JSON.parse(savedFilters);

            $('#typeBase').prop('checked', filters.type === 'BASE');
            $('#typeDlc').prop('checked', filters.type === 'DLC');

            $('#ownershipOwned').prop('checked', filters.ownership === 'Owned');
            $('#ownershipMissing').prop('checked', filters.ownership === 'Missing');

            $('#updateUpToDate').prop('checked', filters.update === 'Up to date');
            $('#updateMissingUpdate').prop('checked', filters.update === 'Outdated');

            $('#completionComplete').prop('checked', filters.completion === 'Complete');
            $('#completionMissingDlc').prop('checked', filters.completion === 'Missing DLC');

            updateFilter();
        }

        const savedSearch = localStorage.getItem('searchTerm');
        if (savedSearch) {
            $('#textFilter').val(savedSearch);
        }

        applyFilters()
    }

    $(document).ready(function () {
        const savedItemsPerPage = localStorage.getItem('itemsPerPage');
        setItemsPerPage(savedItemsPerPage ? parseInt(savedItemsPerPage) : itemsPerPage);

        const savedCardSize = localStorage.getItem('cardSize');
        if (savedCardSize){
            cardSize = parseInt(savedCardSize);
        }

        setView(localStorage.getItem('currentView') || currentView);

        // Fetch initial set of games and render
        fetchGames().then(() => {
            loadFiltersFromStorage();
        });

        // Event listeners for items per page dropdown
        $('.items-per-page').click(function () {
            setItemsPerPage($(this).data('value'));
            renderGames();
        });

        $('#applyCustomItemsPerPage').click(function () {
            const customValue = parseInt($('#customItemsPerPage').val());
            if (customValue > 0) {
                setItemsPerPage(customValue);
                renderGames();
            }
        });

        // Event listener for tile size slider
        $('#cardSizeRange').on('input', function () {
            cardSize = parseInt($(this).val());
            localStorage.setItem('cardSize', cardSize);
            applyTileSize();
        });

        // Event listener for view buttons
        $('.view-toggle-btn').click(function () {
            setView($(this).data('view'));
            renderGames();
        });

        // Handle type filter toggle buttons
        $('.type-toggle').change(function () {
            if ($('#typeBase').is(':checked')) {
                activeTypeFilter = 'BASE';
            } else if ($('#typeDlc').is(':checked')) {
                activeTypeFilter = 'DLC';
            } else {
                activeTypeFilter = '';
            }
            applyFilters();
            saveFiltersToStorage();
        });

        // Handle ownership filter toggle buttons
        $('.ownership-toggle').change(function () {
            if ($('#ownershipOwned').is(':checked')) {
                activeOwnershipFilter = 'Owned';
            } else if ($('#ownershipMissing').is(':checked')) {
                activeOwnershipFilter = 'Missing';
            } else {
                activeOwnershipFilter = '';
            }
            applyFilters();
            saveFiltersToStorage();
        });

        // Handle update filter toggle buttons
        $('.update-toggle').change(function () {
            if ($('#updateUpToDate').is(':checked')) {
                activeUpdateFilter = 'Up to date';
            } else if ($('#updateMissingUpdate').is(':checked')) {
                activeUpdateFilter = 'Outdated';
            } else {
                activeUpdateFilter = '';
            }
            applyFilters();
            saveFiltersToStorage();
        });

        // Handle completion filter toggle buttons
        $('.completion-toggle').change(function () {
            if ($('#completionComplete').is(':checked')) {
                activeCompletionFilter = 'Complete';
            } else if ($('#completionMissingDlc').is(':checked')) {
                activeCompletionFilter = 'Missing DLC';
            } else {
                activeCompletionFilter = '';
            }
            applyFilters();
            saveFiltersToStorage();
        });

        // Listen to input changes in the text filter input
        $("#textFilter").on("input", function () {
            const attributeText = $(this).val();
            localStorage.setItem('searchTerm', attributeText);
            applyFilters();
        });

        // Close popovers
        $(document).on('click', function (e) {
            $('.popover').removeClass('show');
            $('.popover').remove();
        });

        // Add click event on the popover to stop propagation
        $(document).on('click', '.popover', function (e) {
            e.stopPropagation(); // Prevent the click event from bubbling up
        });

    });

    // Store active filters
    let activeTypeFilter = "";
    let activeOwnershipFilter = "";
    let activeUpdateFilter = "";
    let activeCompletionFilter = "";

    function updateFilter() {
        if ($('#typeBase').is(":checked")) {
            activeTypeFilter = 'BASE';
        } else if ($('#typeDlc').is(":checked")) {
            activeTypeFilter = 'DLC';
        } else {
            activeTypeFilter = '';
        }
        if ($('#ownershipOwned').is(":checked")) {
            activeOwnershipFilter = 'Owned';
        } else if ($('#ownershipMissing').is(":checked")) {
            activeOwnershipFilter = 'Missing';
        } else {
            activeOwnershipFilter = '';
        }
        if ($('#updateUpToDate').is(":checked")) {
            activeUpdateFilter = 'Up to date';
        } else if ($('#updateMissingUpdate').is(":checked")) {
            activeUpdateFilter = 'Outdated';
        } else {
            activeUpdateFilter = '';
        }
        if ($('#completionComplete').is(":checked")) {
            activeCompletionFilter = 'Complete';
        } else if ($('#completionMissingDlc').is(":checked")) {
            activeCompletionFilter = 'Missing DLC';
        } else {
            activeCompletionFilter = '';
        }
    }

    // Function to apply filters and show/hide game cards with animation
    function applyFilters() {
        // Get current search term
        const searchTerm = $('#textFilter').val();
        let filtered = filterGamesBySearchTerm(games, searchTerm);

        if (activeTypeFilter) {
            filtered = filtered.filter(game => game.app_type === activeTypeFilter);
        }
        if (activeOwnershipFilter) {
            filtered = filtered.filter(game => activeOwnershipFilter === 'Owned' ? game.owned === true : game.owned === false);
        }
        if (activeUpdateFilter) {
            filtered = filtered.filter(game => activeUpdateFilter === 'Up to date' ? game.has_latest_version === true : game.has_latest_version === false);
        }
        if (activeCompletionFilter) {
            filtered = filtered.filter(game => activeCompletionFilter === 'Complete' ? game.has_all_dlcs === true : game.has_all_dlcs === false);
        }

        filteredGames = filtered;
        currentPage = 1;
        updateFilterCount();
        renderGames();
    }

    function filterGamesBySearchTerm(gameList, searchTerm) {
        if (!searchTerm || searchTerm.trim() === "") {
            return gameList;
        }
        const searchText = searchTerm.toLowerCase();
        return gameList.filter(game =>
            game.app_id?.toLowerCase().includes(searchText) ||
            game.title_id?.toLowerCase().includes(searchText) ||
            game.name?.toLowerCase().includes(searchText) ||
            game.title_id_name?.toLowerCase().includes(searchText)
        );
    }

    // ---------------------------------------------------------- downloader

    let releaseSearchTarget = null;
    let releaseSearchResults = [];

    function missingContentSearchButton(group) {
        // What the search resolves to is decided server side, the browser only says
        // "this title is missing an update" or "this app is missing"
        // ponytail: one search per title group (base or update). Missing DLCs are only
        // counted by the DLC badge — give each DLC its own button if that becomes a need.
        const base = group.base;
        let payload = null;
        if (!base) {
            payload = null;
        } else if (base.has_latest_version === false) {
            payload = {title_id: base.title_id};
        } else if (base.owned === false && base.id) {
            payload = {app_id: base.id};
        }
        if (!payload) {
            return null;
        }
        return $('<span class="badge rounded-pill text-bg-secondary game-tag" title="Search releases"></span>')
            .html('<i class="bi bi-search"></i>')
            .css('cursor', 'pointer')
            .on('click', function (event) {
                event.stopPropagation();
                openReleaseSearch(payload);
            });
    }

    function escapeHtml(text) {
        return $('<div>').text(text == null ? '' : text).html();
    }

    function humanSize(bytes) {
        if (!bytes) return '';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let i = 0, value = bytes;
        while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
        return `${value.toFixed(i ? 1 : 0)} ${units[i]}`;
    }

    function openReleaseSearch(payload) {
        releaseSearchTarget = null;
        releaseSearchResults = [];
        $('#releaseSearchTitle').text('Searching...');
        $('#releaseSearchBody').html('<div class="text-body-secondary">Asking Prowlarr...</div>');
        new bootstrap.Modal('#releaseSearchModal').show();

        $.ajax({
            url: '/api/downloader/search', type: 'POST', contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function (result) {
                if (!result['success']) {
                    const error = (result['errors'] || [{}])[0]['error'] || 'Search failed.';
                    $('#releaseSearchTitle').text('Search');
                    $('#releaseSearchBody').html(`<div class="alert alert-warning">${escapeHtml(error)}</div>`);
                    return;
                }
                releaseSearchTarget = result['target'];
                releaseSearchResults = result['releases'] || [];
                renderReleaseSearch();
            },
            error: function () {
                $('#releaseSearchBody').html('<div class="alert alert-danger">Search request failed.</div>');
            }
        });
    }

    function renderReleaseSearch() {
        const target = releaseSearchTarget;
        $('#releaseSearchTitle').text(`${target.name} — ${target.app_type} v${target.app_version}`);
        if (!releaseSearchResults.length) {
            $('#releaseSearchBody').html(
                '<div class="alert alert-warning">Prowlarr returned no result for this search.</div>');
            return;
        }
        const rows = releaseSearchResults.map((release, index) => {
            const rejected = release.rejected;
            return `<tr class="${rejected ? 'opacity-50' : ''}">
                <td class="small">${escapeHtml(release.title)}
                    ${rejected ? `<div class="text-warning">${escapeHtml(rejected)}</div>` : ''}</td>
                <td class="small text-nowrap">${escapeHtml(release.indexer)}</td>
                <td class="small text-nowrap">${humanSize(release.size)}</td>
                <td class="small text-nowrap">${release.seeders} / ${release.leechers}</td>
                <td class="text-end"><button class="btn btn-sm ${rejected ? 'btn-outline-secondary' : 'btn-primary'}"
                    onClick="grabRelease(${index}, this)">Grab</button></td>
            </tr>`;
        });
        $('#releaseSearchBody').html(`
            <p class="text-body-secondary small">Greyed out releases are the ones the automatic job would refuse,
            with the reason. You can still grab them.</p>
            <div class="table-responsive"><table class="table table-sm table-hover align-middle">
                <thead><tr><th>Release</th><th>Indexer</th><th>Size</th><th>S/L</th><th></th></tr></thead>
                <tbody>${rows.join('')}</tbody>
            </table></div>`);
    }

    function grabRelease(index, button) {
        $(button).prop('disabled', true).text('...');
        $.ajax({
            url: '/api/downloader/grab', type: 'POST', contentType: 'application/json',
            data: JSON.stringify({target: releaseSearchTarget, release: releaseSearchResults[index]}),
            success: function (result) {
                if (result['success']) {
                    $(button).removeClass('btn-primary btn-outline-secondary')
                        .addClass('btn-success').text('Grabbed');
                } else {
                    const error = (result['errors'] || [{}])[0]['error'] || 'Grab failed.';
                    $(button).removeClass('btn-primary').addClass('btn-danger').text('Failed')
                        .attr('title', error);
                }
            },
            error: function () {
                $(button).removeClass('btn-primary').addClass('btn-danger').text('Failed');
            }
        });
    }
</script>

<div class="modal fade" id="releaseSearchModal" tabindex="-1" aria-labelledby="releaseSearchTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="releaseSearchTitle">Search</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="releaseSearchBody"></div>
            <div class="modal-footer">
                <a href="/downloads" class="btn btn-outline-secondary">Downloads</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
