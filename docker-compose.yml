version: "3"

services:
  ownfoil:
    container_name: ownfoil
    image: ghcr.io/exoenjoi/ownfoil:latest
    environment:
      # For write permission in config directory
      - PUID=1000
      - PGID=1000
      # to create/update an admin user at startup
      # - USER_ADMIN_NAME=admin
      # - USER_ADMIN_PASSWORD=asdvnf!546
      # to create/update a regular user at startup
      # - USER_GUEST_NAME=guest
      # - USER_GUEST_PASSWORD=oerze!@8981
    volumes:
      # Mount the common parent of your sources and of the organizer destination as a single
      # volume: hardlinks cannot cross filesystems, two separate mounts would fail with EXDEV.
      # Here /games/torrents is the library and /games/organized the organizer destination.
      - /your/game/directory:/games
      - ./config:/app/config
      - ./data:/app/data
    ports:
      - "8465:8465"